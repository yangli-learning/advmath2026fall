name: Update Remote Course Website

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: update-remote-course-website
  cancel-in-progress: true

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts

      - name: Run update script on remote server
        run: ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -T yang@yangli-feasibility.com 'bash ~/update_advmath.sh'
